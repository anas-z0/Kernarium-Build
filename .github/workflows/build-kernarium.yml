# SPDX-License-Identifier: GPL-2.0-or-later
name: Build Kernarium IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-kernarium.yml
      - dependencies/**
      - kernel/**
      - scripts/patch_series.py
      - tools/rootfs/boot-ramdisk/**
      - tools/rootfs/starter/**

permissions:
  contents: read

concurrency:
  group: kernarium-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  boot-base:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore verified boot base
        id: boot-cache
        uses: actions/cache@v5
        with:
          path: .build/ci-inputs/
          key: boot-base-aarch64-v1-${{ hashFiles('tools/rootfs/starter/**', 'tools/rootfs/producer.sh', 'tools/rootfs/boot-ramdisk/verify_base.py') }}
      - name: Install Linux image build tools
        if: steps.boot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cmake cpio curl debootstrap e2fsprogs \
            file gawk git gzip libncurses-dev patch python3 rsync \
            gdisk tar unzip wget xz-utils
          python3 -B tests/tooling/rootfs/test_boot_base.py \
            --boot-ramdisk tools/rootfs/boot-ramdisk
      - name: Produce and verify Linux boot base
        if: steps.boot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tools/rootfs/starter/build-all.sh --product boot-base-aarch64 \
            --work "$RUNNER_TEMP/boot-base-work" \
            --output "$RUNNER_TEMP/boot-base-release" --jobs "$(nproc)"
          mkdir -p .build/ci-inputs
          cp "$RUNNER_TEMP/boot-base-release/uml-boot-base-aarch64.cpio.gz" \
            .build/ci-inputs/boot-base.cpio.gz
          cp "$RUNNER_TEMP/boot-base-release/release-manifest.json" .build/ci-inputs/
          python3 -B tools/rootfs/boot-ramdisk/verify_base.py \
            --write-descriptor .build/ci-inputs/boot-base.env \
            --architecture aarch64 --release "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --archive .build/ci-inputs/boot-base.cpio.gz
      - name: Verify boot base before publication
        run: |
          set -euo pipefail
          python3 -B tools/rootfs/boot-ramdisk/verify_base.py \
            --descriptor .build/ci-inputs/boot-base.env \
            --archive .build/ci-inputs/boot-base.cpio.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-boot-base
          path: .build/ci-inputs/
          if-no-files-found: error
          retention-days: 7

  kernels:
    needs: boot-base
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install kernel build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install cmake ninja make llvm lld bison flex autoconf automake libtool pkgconf rsync
          python3 -m venv .build/ci-tools
          .build/ci-tools/bin/pip install 'meson>=1.7,<2'
          echo "$PWD/.build/ci-tools/bin" >> "$GITHUB_PATH"
          for tool in llvm lld bison flex; do
            echo "$(brew --prefix "$tool")/bin" >> "$GITHUB_PATH"
          done
          # Topic replay uses the caller's configured Git committer identity.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          {
            echo "UML_KERNEL_CC=$(brew --prefix llvm)/bin/clang"
            echo "UML_KERNEL_HOST_CC=$(brew --prefix llvm)/bin/clang"
            echo "UML_KERNEL_LD=$(brew --prefix lld)/bin/ld.lld"
          } >> "$GITHUB_ENV"
          "$(brew --prefix llvm)/bin/clang" --version
          "$(brew --prefix lld)/bin/ld.lld" --version
          "$(brew --prefix llvm)/bin/llvm-objcopy" --version
      - name: Identify kernel toolchain
        id: kernel-toolchain
        run: |
          set -euo pipefail
          {
            "$UML_KERNEL_CC" --version
            "$UML_KERNEL_LD" --version
            "$(brew --prefix llvm)/bin/llvm-objcopy" --version
            gmake --version
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            sw_vers -productVersion
          } | shasum -a 256 | awk '{ print "fingerprint=" $1 }' >> "$GITHUB_OUTPUT"
      - name: Restore accepted kernel bundles
        id: kernel-cache
        uses: actions/cache/restore@v5
        with:
          path: .build/kernel/artifacts/
          key: kernels-arm64-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-toolchain.outputs.fingerprint }}-${{ hashFiles('kernel/**', 'dependencies/manifest.tsv', 'dependencies/patches/**', 'dependencies/kernel-host-tools/**', 'dependencies/build-kernel-host-tools.sh', 'dependencies/build-common.sh', 'scripts/patch_series.py') }}
      - name: Build verified kernel host tools
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dependencies/prepare.sh --product kernel-host-tools
          dependencies/prepare.sh --archive-manifest dependencies/kernel-host-tools/archives.tsv
          dependencies/build-kernel-host-tools.sh --jobs "$(sysctl -n hw.logicalcpu)"
      - name: Create case-sensitive kernel workspace
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/kernarium-kernel"
          mkdir -p "$mount"
          hdiutil create -size 60g -type SPARSE -fs 'Case-sensitive APFS' \
            -volname KernariumKernel "$RUNNER_TEMP/kernel.sparseimage"
          hdiutil attach "$RUNNER_TEMP/kernel.sparseimage" \
            -mountpoint "$mount" -nobrowse
          echo "KERNEL_WORK=$mount" >> "$GITHUB_ENV"
          probe=$(mktemp -d "$mount/.case-probe.XXXXXX")
          touch "$probe/lowercase"
          if [ -e "$probe/LOWERCASE" ]; then
            echo 'Kernel workspace must be case-sensitive' >&2
            exit 1
          fi
          rm "$probe/lowercase"
          rmdir "$probe"
          printf 'UML_KERNEL_SOURCE_DIR=%s/linux\n' "$mount" \
            > kernel/mainline-6.18/source-location.conf
      - name: Build and publish both accepted kernel products
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          kernel/mainline-6.18/scripts/prepare-source.sh
          for product in linux android; do
            descriptor=kernel/mainline-6.18/artifacts/accepted-4k.env
            if [ "$product" = android ]; then
              descriptor=kernel/mainline-6.18/artifacts/accepted-android-4k.env
            fi
            # These are tracked repository descriptors, not remote input.
            # shellcheck disable=SC1090
            source "$descriptor"
            kernel/mainline-6.18/build/build-kernel.sh \
              --product "$product" --build "$KERNEL_WORK/build-$product" \
              --jobs "$(sysctl -n hw.logicalcpu)"
            python3 -B kernel/mainline-6.18/build/publish-artifact.py \
              --source "$KERNEL_WORK/linux" --build "$KERNEL_WORK/build-$product" \
              --product "$product" --output-root "$PWD/.build/kernel/artifacts" \
              --release-id "ci-$UML_KERNEL_ARTIFACT_RELEASE_ID" \
              --objcopy "$(brew --prefix llvm)/bin/llvm-objcopy"
          done
      - name: Verify accepted kernel bundles before publication
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import sys
          root = Path.cwd()
          common = root / 'kernel/common'
          sys.path.insert(0, str(common / 'artifacts'))
          from kernel_artifact import parse_env, verify_artifact, verify_compatible_identity
          line = root / 'kernel/mainline-6.18'
          for name in ('accepted-4k.env', 'accepted-android-4k.env'):
              descriptor = parse_env(line / 'artifacts' / name)
              family = descriptor['UML_KERNEL_ARTIFACT_FAMILY']
              release_id = 'ci-' + descriptor['UML_KERNEL_ARTIFACT_RELEASE_ID']
              bundle = root / '.build/kernel/artifacts' / f'{family}-arm64-4k-{release_id}'
              manifest = verify_artifact(bundle, common, line / 'patches/metadata.env',
                                         common / 'abi/identity.env')
              verify_compatible_identity(manifest, common / 'abi/identity.env',
                                         family, 'arm64', '6.18')
              if manifest['release_id'] != release_id:
                  raise SystemExit(f'Unexpected CI release identity: {bundle}')
              print(f'Verified CI kernel: {bundle.name}, {manifest["release"]}')
          PY
      - name: Save verified kernel bundles immediately
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build/kernel/artifacts/
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-bundles
          path: .build/kernel/artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Detach kernel workspace
        if: always()
        run: |
          if [ -n "${KERNEL_WORK:-}" ]; then
            hdiutil detach "$KERNEL_WORK"
          fi

  app:
    needs: kernels
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kernel-bundles
          path: .build/kernel/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: verified-boot-base
          path: .build/ci-inputs
      - name: Install dependency build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk%%.*}" -ge 27
          brew install cmake ninja make bison flex autoconf automake libtool pkgconf rsync
          python3 -m venv .build/ci-tools
          .build/ci-tools/bin/pip install 'meson>=1.7,<2' mako packaging pyyaml
          echo "$PWD/.build/ci-tools/bin" >> "$GITHUB_PATH"
          for tool in bison flex; do
            echo "$(brew --prefix "$tool")/bin" >> "$GITHUB_PATH"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Build verified iOS dependencies
        run: |
          set -euo pipefail
          jobs=$(sysctl -n hw.logicalcpu)
          for product in apple-gpu-vulkan-experiment ios-network ios-storage ios-compression; do
            dependencies/prepare.sh --product "$product"
          done
          dependencies/build-apple-gpu.sh --platform ios --jobs "$jobs"
          dependencies/build-ios-network.sh --platform ios --jobs "$jobs"
          dependencies/build-ios-storage.sh --jobs "$jobs"
          dependencies/build-ios-zstd.sh --jobs "$jobs"
      - name: Build and package both runtime frameworks
        run: |
          set -euo pipefail
          for preset in kernarium-ios-device kernarium-ios-device-android; do
            descriptor=kernel/mainline-6.18/artifacts/accepted-4k.env
            artifact_variable=UML_MAINLINE_618_KERNEL_ARTIFACT_DIR
            if [ "$preset" = kernarium-ios-device-android ]; then
              descriptor=kernel/mainline-6.18/artifacts/accepted-android-4k.env
              artifact_variable=UML_ANDROID17_KERNEL_ARTIFACT_DIR
            fi
            # shellcheck disable=SC1090
            source "$descriptor"
            bundle="$PWD/.build/kernel/artifacts/$UML_KERNEL_ARTIFACT_FAMILY-arm64-4k-ci-$UML_KERNEL_ARTIFACT_RELEASE_ID"
            cmake --preset "$preset" \
              -DUML_BOOT_BASE_ARCHIVE="$PWD/.build/ci-inputs/boot-base.cpio.gz" \
              -DUML_BOOT_BASE_DESCRIPTOR="$PWD/.build/ci-inputs/boot-base.env" \
              "-D$artifact_variable=$bundle"
            cmake --build --preset "$preset" --parallel "$(sysctl -n hw.logicalcpu)"
          done
          Kernarium/scripts/package-ios-frameworks.sh --sdk device
      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild -project Kernarium/Kernarium.xcodeproj -scheme Kernarium \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ci-derived-data \
            -clonedSourcePackagesDirPath .build/swift-packages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          python3 -B scripts/check-no-fexcore.py .build/ci-derived-data/Build/Products
          python3 -B scripts/check-no-aot-diagnostics.py .build/ci-derived-data/Build/Products
      - name: Package IPA for external signing
        run: |
          set -euo pipefail
          mkdir -p .build/ci-output/Payload
          ditto .build/ci-derived-data/Build/Products/Release-iphoneos/Kernarium.app \
            .build/ci-output/Payload/Kernarium.app
          cd .build/ci-output
          ditto -c -k --keepParent Payload Kernarium-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Kernarium-unsigned-ipa
          path: .build/ci-output/Kernarium-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
